<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesores · CRO-NO</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="icon" type="image/png" th:href="@{/img/logo.png}">
</head>
<body>
<nav class="nav">
    <img th:src="@{/img/logo.png}" alt="Logo CRO-NO">
    <a class="marca" th:href="@{/}">CRO-NO</a>
    <a th:href="@{/}">Datos</a>
    <a th:href="@{/estudiantes}">Estudiantes</a>
    <a th:href="@{/profesores}" class="activo">Profesores</a>
    <a th:href="@{/materias}">Materias</a>
    <a th:href="@{/clases}">Clases</a>
    <a th:href="@{/asignacion}">Asignación</a>
    <a th:href="@{/horario}">Horario</a>
    <a th:href="@{/reportes}">Reportes</a>
</nav>

<h1>Profesores</h1>
<p class="subtitulo">Registro dinámico de profesores.</p>

<div class="alerta ok" th:if="${mensaje}" th:text="${mensaje}"></div>
<div class="alerta error" th:if="${error}" th:text="${error}"></div>

<section class="tarjeta">
    <h2>Nuevo profesor</h2>
    <form class="campos" th:action="@{/profesores}" method="post">
        <div>
            <label for="id">Id <span class="ayuda">(empieza con P)</span></label>
            <input type="text" id="id" name="id" placeholder="P222" required>
        </div>
        <div>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        <div>
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" placeholder="nombre@javeriana.edu.co" required>
        </div>
        <div>
            <button type="submit" class="boton">Registrar</button>
        </div>
    </form>
</section>

<section class="tarjeta tabla-contenedor">
    <table>
        <thead>
        <tr><th>Id</th><th>Nombre</th><th>Correo</th><th>Clases que dicta</th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${profesores}">
            <td th:text="${p.id}">P201</td>
            <td th:text="${p.nombre}">Nombre</td>
            <td th:text="${p.correo}">correo</td>
            <td>
                <span class="etiqueta-chip" th:each="c : ${p.cursos}"
                    th:text="${c.id}" th:title="${c.materia.nombre + ' · ' + c.horarioTexto}">501</span>
                <span class="vacio" th:if="${#lists.isEmpty(p.cursos)}">Ninguna</span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(profesores)}">
            <td colspan="4" class="vacio">No hay profesores registrados.</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
