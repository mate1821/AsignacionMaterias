<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignación · CRO-NO</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="icon" type="image/png" th:href="@{/img/logo.png}">
</head>
<body>
<nav class="nav">
    <img th:src="@{/img/logo.png}" alt="Logo CRO-NO">
    <a class="marca" th:href="@{/}">CRO-NO</a>
    <a th:href="@{/}">Datos</a>
    <a th:href="@{/estudiantes}">Estudiantes</a>
    <a th:href="@{/profesores}">Profesores</a>
    <a th:href="@{/materias}">Materias</a>
    <a th:href="@{/clases}">Clases</a>
    <a th:href="@{/asignacion}" class="activo">Asignación</a>
    <a th:href="@{/horario}">Horario</a>
    <a th:href="@{/reportes}">Reportes</a>
</nav>

<h1>Asignación</h1>
<p class="subtitulo">Ejecuta el algoritmo sobre los datos cargados. Borra la asignación anterior.</p>

<div class="alerta ok" th:if="${mensaje}" th:text="${mensaje}"></div>
<div class="alerta error" th:if="${error}" th:text="${error}"></div>

<div class="contadores">
    <div class="contador"><div class="numero" th:text="${totalEstudiantes}">0</div><div class="etiqueta">Estudiantes</div></div>
    <div class="contador"><div class="numero" th:text="${totalClases}">0</div><div class="etiqueta">Clases</div></div>
</div>

<section class="tarjeta">
    <form th:action="@{/asignacion/ejecutar}" method="post">
        <button type="submit" class="boton grande"
                th:disabled="${totalEstudiantes == 0 or totalClases == 0}">Ejecutar asignación</button>
    </form>
    <p class="vacio" th:if="${totalEstudiantes == 0 or totalClases == 0}">
        Primero cargue estudiantes y clases en <a th:href="@{/}">Datos</a>.
    </p>
</section>
</body>
</html>
